<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div id="main">
      <h2 id="head">Login page</h2>

  <p><input type="text" placeholder="name" id="name"></input></p>
  <p><input type="email" placeholder="email" id="email"></input></p>
  <button onclick="submit()" id="submit">sumbit</button>
  </div>
    <script>
      function submit() {
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;

    fetch("https://user-registration-system.onrender.com/user", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ name, email })
    });
          .then(res => res.text())
    .then(data => {
        console.log("SERVER RESPONSE:", data);
        alert(data);
    })
    .catch(err => {
        console.log("ERROR:", err);
        alert("Request failed");
    });
}
    </script>
</body>
</html>
